<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>🎄 聖誕樹裝飾</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b1d3a;
  overflow:hidden;
  font-family:system-ui;
  color:white;
}
canvas{display:block}

.controls{
  position:fixed;
  left:20px;
  top:20px;
  width:250px;
  background:rgba(20,30,50,.9);
  padding:14px;
  border-radius:14px;
  z-index:10;
  font-size:14px;
}
.controls label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
.controls button, .controls select{
  width:100%;
  margin-top:8px;
  padding:6px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
hr{margin:10px 0;opacity:.3}
</style>
</head>

<body>

<div class="controls">
  <strong>🎨 顏色設定</strong>
  <label>🌲 樹葉 <input type="color" id="leaf"></label>
  <label>🎀 彩帶 <input type="color" id="ribbon"></label>
  <label>🔴 小球 <input type="color" id="ball"></label>
  <label>🎁 禮物 <input type="color" id="gift"></label>
  <label>⭐ 星星 <input type="color" id="star"></label>

  <hr>

  <button id="undoBtn">↩ 復原 (Ctrl+Z)</button>
  <button id="redoBtn">↪ 重做 (Ctrl+Shift+Z)</button>

  <hr>

  <button id="addGift">➕ 新增禮物</button>
</div>

<canvas id="c"></canvas>

<script>
/* ===== Canvas ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);
const CX = () => canvas.width / 2;

/* ===== 顏色 ===== */
const COLORS = {
  leaf:"#1f6b45",
  ribbon:"#d4af37",
  ball:"#c0392b",
  gift:"#ff6fae",
  star:"#fff2a8"
};

leaf.value   = COLORS.leaf;
ribbon.value = COLORS.ribbon;
ball.value   = COLORS.ball;
gift.value   = COLORS.gift;
star.value   = COLORS.star;

/* ===== Undo / Redo ===== */
const undoStack = [];
const redoStack = [];

function snapshot(){
  undoStack.push(JSON.stringify({
    balls,
    gifts,
    colors: {...COLORS}
  }));
  if(undoStack.length > 50) undoStack.shift();
  redoStack.length = 0;
}

function restore(state){
  balls.length = 0;
  gifts.length = 0;

  state.balls.forEach(b=>balls.push(b));
  state.gifts.forEach(g=>gifts.push(g));
  Object.assign(COLORS, state.colors);

  leaf.value = COLORS.leaf;
  ribbon.value = COLORS.ribbon;
  ball.value = COLORS.ball;
  gift.value = COLORS.gift;
  star.value = COLORS.star;
}

function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify({
    balls,
    gifts,
    colors:{...COLORS}
  }));
  restore(JSON.parse(undoStack.pop()));
}

function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify({
    balls,
    gifts,
    colors:{...COLORS}
  }));
  restore(JSON.parse(redoStack.pop()));
}

undoBtn.onclick = undo;
redoBtn.onclick = redo;

document.addEventListener("keydown", e=>{
  if((e.ctrlKey || e.metaKey) && e.key==="z"){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }
});

/* ===== 綁定顏色（即時 + 記錄） ===== */
["leaf","ribbon","ball","gift","star"].forEach(id=>{
  document.getElementById(id).oninput = e=>{
    snapshot();
    COLORS[id] = e.target.value;
  };
});

/* ===== 樹 ===== */
const leaves = [
  { y:210, w:220, h:60 },
  { y:270, w:280, h:70 },
  { y:340, w:340, h:80 }
];
const ribbons = [
  { leaf:0, offset:0 },
  { leaf:1, offset:0 },
  { leaf:2, offset:0 }
];

const balls = [];
const gifts = [];

/* ===== 雪花 ===== */
const snow = Array.from({length:120}, () => ({
  x: Math.random()*innerWidth,
  y: Math.random()*innerHeight,
  r: Math.random()*2+1,
  s: Math.random()*0.4+0.2
}));

/* ===== 拖曳 ===== */
let dragging = null;

canvas.onmousedown = e=>{
  snapshot();
  dragging = null;
  const x=e.offsetX,y=e.offsetY;

  gifts.forEach(g=>{
    if(x>CX()+g.x-g.w/2 && x<CX()+g.x+g.w/2 && y>g.y && y<g.y+g.h)
      dragging=g;
  });

  balls.forEach(b=>{
    if(Math.hypot(x-(CX()+b.x),y-b.y)<10) dragging=b;
  });

  if(!dragging) balls.push({x:x-CX(),y});
};

canvas.onmousemove = e=>{
  if(!dragging) return;
  dragging.x=e.offsetX-CX();
  dragging.y=e.offsetY;
};

canvas.onmouseup = ()=>dragging=null;

/* ===== 禮物 ===== */
addGift.onclick = ()=>{
  snapshot();
  gifts.push({x:0,y:420,w:40,h:30});
};

/* ===== Render ===== */
function drawStar(){
  ctx.save();
  ctx.translate(CX(),150);
  ctx.fillStyle=COLORS.star;
  ctx.shadowColor=COLORS.star;
  ctx.shadowBlur=20;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*18,-Math.sin((18+i*72)*Math.PI/180)*18);
    ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8,-Math.sin((54+i*72)*Math.PI/180)*8);
  }
  ctx.fill();
  ctx.restore();
}

function drawTrunk(){
  ctx.fillStyle="#8b5a2b";
  ctx.fillRect(CX()-18,360,36,95);
}

function drawLeaves(){
  ctx.fillStyle=COLORS.leaf;
  leaves.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(CX()-l.w/2,l.y);
    ctx.quadraticCurveTo(CX(),l.y-l.h,CX()+l.w/2,l.y);
    ctx.quadraticCurveTo(CX(),l.y+l.h*0.7,CX()-l.w/2,l.y);
    ctx.fill();
  });
}

function drawRibbons(){
  ctx.strokeStyle=COLORS.ribbon;
  ctx.lineWidth=5;
  ribbons.forEach(r=>{
    const l=leaves[r.leaf];
    ctx.beginPath();
    ctx.moveTo(CX()-l.w/2+20,l.y);
    ctx.quadraticCurveTo(CX(),l.y-15,CX()+l.w/2-20,l.y);
    ctx.stroke();
  });
}

function drawBalls(){
  ctx.fillStyle=COLORS.ball;
  balls.forEach(b=>{
    ctx.beginPath();
    ctx.arc(CX()+b.x,b.y,8,0,Math.PI*2);
    ctx.fill();
  });
}

function drawGifts(){
  gifts.forEach(g=>{
    ctx.fillStyle=COLORS.gift;
    ctx.fillRect(CX()+g.x-g.w/2,g.y,g.w,g.h);
  });
}

function drawSnow(){
  ctx.fillStyle="white";
  snow.forEach(s=>{
    s.y+=s.s;
    if(s.y>canvas.height) s.y=-5;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
}

(function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStar();
  drawTrunk();
  drawLeaves();
  drawRibbons();
  drawBalls();
  drawGifts();
  drawSnow();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
