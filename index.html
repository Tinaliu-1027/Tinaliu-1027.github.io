<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Christmas Tree Designer</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background:#1e1e1e; color:#fff; display:flex; }
  #panel {
    width: 260px; background:#2a2a2a; padding:12px; box-sizing:border-box;
  }
  #panel h3 { margin:8px 0 4px; font-size:14px; }
  #panel button, #panel select, #panel input[type="color"] {
    width:100%; margin-bottom:8px;
  }
  canvas { flex:1; background:#0f1a24; }
</style>
</head>
<body>

<div id="panel">
  <h3>🌲 樹葉顏色</h3>
  <input type="color" id="leafColor" value="#1f8f4e">

  <h3>🎀 彩帶顏色</h3>
  <input type="color" id="ribbonColor" value="#d94b4b">

  <h3>🔴 小球顏色</h3>
  <input type="color" id="ballColor" value="#ff3b3b">

  <h3>🎁 禮物顏色</h3>
  <input type="color" id="giftColor" value="#3b7cff">
  <button id="addGift">新增禮物</button>

  <h3>💾 儲存 / 載入</h3>
  <button id="saveBtn">儲存目前設計</button>
  <select id="loadSelect"></select>

  <button id="exportBtn">📸 匯出 PNG</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){
  canvas.width = window.innerWidth - 260;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const state = {
  colors: {
    leaf: '#1f8f4e',
    ribbon: '#d94b4b',
    ball: '#ff3b3b',
    gift: '#3b7cff'
  },
  gifts: [],
  snow: []
};

// snow init
for(let i=0;i<80;i++){
  state.snow.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2+1,
    s: Math.random()*0.5+0.2
  });
}

// controls
leafColor.oninput = e => state.colors.leaf = e.target.value;
ribbonColor.oninput = e => state.colors.ribbon = e.target.value;
ballColor.oninput = e => state.colors.ball = e.target.value;
giftColor.oninput = e => state.colors.gift = e.target.value;

addGift.onclick = () => {
  state.gifts.push({ x: canvas.width/2 + Math.random()*60-30, y: canvas.height*0.75 });
};

// save / load
function refreshLoadList(){
  loadSelect.innerHTML='';
  Object.keys(localStorage).filter(k=>k.startsWith('tree_')).forEach(k=>{
    const o=document.createElement('option');
    o.value=k; o.textContent=k.replace('tree_','');
    loadSelect.appendChild(o);
  });
}
saveBtn.onclick=()=>{
  const name=prompt('存檔名稱');
  if(!name) return;
  localStorage.setItem('tree_'+name, JSON.stringify(state));
  refreshLoadList();
};
loadSelect.onchange=()=>{
  const data=localStorage.getItem(loadSelect.value);
  if(data) Object.assign(state, JSON.parse(data));
};
refreshLoadList();

// export
exportBtn.onclick=()=>{
  const a=document.createElement('a');
  a.download='tree.png';
  a.href=canvas.toDataURL();
  a.click();
};

function drawStar(x,y,r){
  ctx.save();
  ctx.translate(x,y);
  ctx.beginPath();
  for(let i=0;i<5;i++){
    ctx.lineTo(0,-r);
    ctx.rotate(Math.PI/5);
    ctx.lineTo(0,-r/2);
    ctx.rotate(Math.PI/5);
  }
  ctx.closePath();
  ctx.fillStyle='#ffd966';
  ctx.fill();
  ctx.restore();
}

function update(){
  state.snow.forEach(s=>{
    s.y+=s.s;
    if(s.y>canvas.height){ s.y=0; s.x=Math.random()*canvas.width; }
  });
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // snow
  ctx.fillStyle='#fff';
  state.snow.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  const cx = canvas.width/2;
  const baseY = canvas.height*0.65;

  // tree leaves
  ctx.fillStyle = state.colors.leaf;
  [[0,180,90],[60,140,80],[110,100,70]].forEach(([y,w,h])=>{
    ctx.beginPath();
    ctx.moveTo(cx-w, baseY-y);
    ctx.lineTo(cx+w, baseY-y);
    ctx.lineTo(cx, baseY-y-h);
    ctx.closePath();
    ctx.fill();
  });

  // ribbon
  ctx.strokeStyle = state.colors.ribbon;
  ctx.lineWidth=6;
  [40,90,140].forEach(y=>{
    ctx.beginPath();
    ctx.moveTo(cx-90, baseY-y);
    ctx.quadraticCurveTo(cx, baseY-y+10, cx+90, baseY-y);
    ctx.stroke();
  });

  // trunk (一定存在)
  ctx.fillStyle='#6b3f1d';
  ctx.fillRect(cx-18, baseY+10, 36, 60);

  // star
  drawStar(cx, baseY-200, 18);

  // gifts
  ctx.fillStyle = state.colors.gift;
  state.gifts.forEach(g=>{
    ctx.fillRect(g.x-20,g.y-20,40,30);
  });
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
