<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>🎄 聖誕樹裝飾</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b1d3a;
  overflow:hidden;
  font-family:system-ui;
  color:white;
}
canvas{display:block}

/* 左側控制面板 */
.controls{
  position:fixed;
  left:20px;
  top:20px;
  background:rgba(20,30,50,.9);
  padding:14px;
  border-radius:14px;
  z-index:10;
  font-size:14px;
  width:230px;
}
.controls label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
.controls button, .controls select{
  width:100%;
  margin-top:8px;
  padding:6px;
  border-radius:8px;
  border:none;
}

/* 右上角說明按鈕 */
.helpBtn{
  position:fixed;
  right:20px;
  top:20px;
  z-index:20;
  padding:8px 14px;
  border-radius:20px;
  border:none;
  background:#ffd966;
  color:#333;
  font-weight:bold;
  cursor:pointer;
}

/* 使用說明視窗 */
.helpOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}
.helpBox{
  background:#1e2a4a;
  max-width:420px;
  width:90%;
  padding:20px;
  border-radius:16px;
  line-height:1.6;
}
.helpBox h2{
  margin-top:0;
}
.helpBox button{
  margin-top:14px;
  width:100%;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#ffd966;
  font-weight:bold;
}
</style>
</head>

<body>

<button class="helpBtn" id="helpBtn">📖 使用說明</button>

<div class="controls">
  <strong>🎨 顏色設定</strong>
  <label>🌲 樹葉 <input type="color" id="leaf"></label>
  <label>🎀 彩帶 <input type="color" id="ribbon"></label>
  <label>🔴 小球 <input type="color" id="ball"></label>
  <label>⭐ 星星 <input type="color" id="star"></label>

  <hr style="margin:10px 0;opacity:.3">

  <strong>🔄 操作</strong>
  <button id="undoBtn">↶ 復原</button>
  <button id="redoBtn">↷ 重做</button>

  <hr style="margin:10px 0;opacity:.3">

  <strong>💾 儲存 / 載入</strong>
  <select id="slot">
    <option value="1">存檔 1</option>
    <option value="2">存檔 2</option>
    <option value="3">存檔 3</option>
  </select>
  <button id="saveBtn">💾 儲存</button>
  <button id="loadBtn">📂 載入</button>
</div>

<!-- 使用說明 -->
<div class="helpOverlay" id="helpOverlay">
  <div class="helpBox">
    <h2>🎄 聖誕樹使用說明</h2>
    <ul>
      <li>🖱 點畫面任意位置：新增小球</li>
      <li>🖐 拖曳小球 / 彩帶：自由移動</li>
      <li>🎀 彩帶靠近樹葉：會出現吸附線</li>
      <li>🎨 左側可調整所有顏色</li>
      <li>🔄 復原 / 重做：按鈕或 Ctrl + Z / Y</li>
      <li>💾 儲存 / 載入：可使用多個存檔</li>
      <li>❄ 雪花會自動飄動（不用操作）</li>
    </ul>
    <button id="closeHelp">我知道了</button>
  </div>
</div>

<canvas id="c"></canvas>

<script>
/* Canvas */
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();addEventListener("resize",resize);
const CX=()=>canvas.width/2;

/* 使用說明 */
helpBtn.onclick=()=>helpOverlay.style.display="flex";
closeHelp.onclick=()=>helpOverlay.style.display="none";
helpOverlay.onclick=e=>{
  if(e.target===helpOverlay) helpOverlay.style.display="none";
};

/* 顏色 */
const COLORS={leaf:"#1f6b45",ribbon:"#d4af37",ball:"#c0392b",star:"#fff2a8"};
leaf.value=COLORS.leaf;ribbon.value=COLORS.ribbon;
ball.value=COLORS.ball;star.value=COLORS.star;

/* 資料 */
const balls=[];
const ribbons=[{y:260},{y:310},{y:360}];
const leafCenters=[210,270,340];

/* 雪花 */
const snow=Array.from({length:120},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:Math.random()*2+1,
  s:Math.random()*0.4+0.2
}));

/* 星星動畫 */
let starPulse=1,starDir=0.008;

/* History */
const history=[],redo=[];
function saveHistory(){
  history.push(JSON.stringify({balls,ribbons,colors:COLORS}));
  if(history.length>100) history.shift();
  redo.length=0;
}
leaf.oninput=e=>{COLORS.leaf=e.target.value;saveHistory();}
ribbon.oninput=e=>{COLORS.ribbon=e.target.value;saveHistory();}
ball.oninput=e=>{COLORS.ball=e.target.value;saveHistory();}
star.oninput=e=>{COLORS.star=e.target.value;saveHistory();}

undoBtn.onclick=()=>{if(history.length>1){redo.push(history.pop());load(history.at(-1));}};
redoBtn.onclick=()=>{if(redo.length){const s=redo.pop();history.push(s);load(s);}};

addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key==="z"){e.preventDefault();undoBtn.onclick();}
  if(e.ctrlKey&&(e.key==="y"||(e.shiftKey&&e.key==="Z"))){e.preventDefault();redoBtn.onclick();}
});

function load(s){
  const d=JSON.parse(s);
  balls.length=0;d.balls.forEach(b=>balls.push(b));
  ribbons.length=0;d.ribbons.forEach(r=>ribbons.push(r));
  Object.assign(COLORS,d.colors);
  leaf.value=COLORS.leaf;ribbon.value=COLORS.ribbon;
  ball.value=COLORS.ball;star.value=COLORS.star;
}

/* 拖曳 */
let drag=null,type=null,snap=null;
canvas.onmousedown=e=>{
  const x=e.offsetX,y=e.offsetY;
  drag=null;snap=null;
  ribbons.forEach(r=>{if(Math.abs(y-r.y)<10){drag=r;type="r";}});
  balls.forEach(b=>{
    if(Math.hypot(x-(CX()+b.x),y-b.y)<10){drag=b;type="b";}
  });
  if(!drag){balls.push({x:x-CX(),y});saveHistory();}
};
canvas.onmousemove=e=>{
  if(!drag)return;
  if(type==="b"){drag.x=e.offsetX-CX();drag.y=e.offsetY;}
  if(type==="r"){
    drag.y=e.offsetY;snap=null;
    leafCenters.forEach(c=>{if(Math.abs(drag.y-c)<12)snap=c;});
  }
};
canvas.onmouseup=()=>{
  if(type==="r"&&snap!==null)drag.y=snap;
  if(drag)saveHistory();
  drag=null;type=null;snap=null;
};

/* Update / Render */
function update(){
  snow.forEach(s=>{s.y+=s.s;if(s.y>canvas.height)s.y=-5;});
  starPulse+=starDir;
  if(starPulse>1.25||starPulse<0.85)starDir*=-1;
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStar();drawLeaves();drawRibbons();drawBalls();drawSnow();
}
function drawStar(){
  ctx.save();
  ctx.translate(CX(),150);
  ctx.scale(starPulse,starPulse);
  ctx.fillStyle=COLORS.star;
  ctx.shadowColor=COLORS.star;
  ctx.shadowBlur=20;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*18,-Math.sin((18+i*72)*Math.PI/180)*18);
    ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8,-Math.sin((54+i*72)*Math.PI/180)*8);
  }
  ctx.fill();ctx.restore();
}
function drawLeaves(){
  [[210,60],[270,70],[340,80]].forEach(l=>{
    ctx.fillStyle=COLORS.leaf;
    ctx.beginPath();
    ctx.moveTo(CX()-l[1]/2,l[0]);
    ctx.quadraticCurveTo(CX(),l[0]-l[1],CX()+l[1]/2,l[0]);
    ctx.quadraticCurveTo(CX(),l[0]+l[1]*.7,CX()-l[1]/2,l[0]);
    ctx.fill();
  });
}
function drawRibbons(){
  ctx.strokeStyle=COLORS.ribbon;ctx.lineWidth=8;
  ribbons.forEach(r=>{
    ctx.beginPath();
    ctx.moveTo(CX()-160,r.y);
    ctx.quadraticCurveTo(CX(),r.y-18,CX()+160,r.y);
    ctx.stroke();
  });
}
function drawBalls(){
  ctx.fillStyle=COLORS.ball;
  balls.forEach(b=>{
    ctx.beginPath();
    ctx.arc(CX()+b.x,b.y,8,0,Math.PI*2);
    ctx.fill();
  });
}
function drawSnow(){
  ctx.fillStyle="white";
  snow.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
}

/* 儲存 / 載入 */
saveBtn.onclick=()=>localStorage.setItem("tree_"+slot.value,history.at(-1));
loadBtn.onclick=()=>{
  const d=localStorage.getItem("tree_"+slot.value);
  if(!d)return alert("沒有存檔");
  history.length=0;history.push(d);load(d);
};

/* 啟動 */
saveHistory();
(function loop(){update();render();requestAnimationFrame(loop);})();
</script>
</body>
</html>
