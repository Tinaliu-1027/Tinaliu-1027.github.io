<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>🎄 聖誕樹裝飾</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b1d3a;
  overflow:hidden;
  font-family:system-ui;
  color:white;
}
canvas{display:block}

/* 左側控制面板 */
.controls{
  position:fixed;
  left:20px;
  top:20px;
  width:250px;
  background:rgba(20,30,50,.9);
  padding:14px;
  border-radius:14px;
  z-index:10;
  font-size:14px;
}
.controls label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
.controls button{
  width:100%;
  margin-top:8px;
  padding:6px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
hr{margin:10px 0;opacity:.3}
</style>
</head>

<body>

<div class="controls">
  <strong>🎨 顏色設定</strong>
  <label>🌲 樹葉 <input type="color" id="leaf"></label>
  <label>🎀 彩帶 <input type="color" id="ribbon"></label>
  <label>🔴 小球 <input type="color" id="ball"></label>
  <label>🎁 禮物 <input type="color" id="gift"></label>
  <label>⭐ 星星 <input type="color" id="star"></label>

  <hr>

  <strong>🎁 禮物</strong>
  <button id="addGift">➕ 新增禮物</button>
</div>

<canvas id="c"></canvas>

<script>
/* ===== Canvas ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);
const CX = () => canvas.width / 2;

/* ===== 顏色 ===== */
const COLORS = {
  leaf:"#1f6b45",
  ribbon:"#d4af37",
  ball:"#c0392b",
  gift:"#ff6fae",
  star:"#fff2a8"
};

leaf.value   = COLORS.leaf;
ribbon.value = COLORS.ribbon;
ball.value   = COLORS.ball;
gift.value   = COLORS.gift;
star.value   = COLORS.star;

leaf.oninput   = e => COLORS.leaf   = e.target.value;
ribbon.oninput = e => COLORS.ribbon = e.target.value;
ball.oninput   = e => COLORS.ball   = e.target.value;
gift.oninput   = e => COLORS.gift   = e.target.value;
star.oninput   = e => COLORS.star   = e.target.value;

/* ===== 樹葉資料 ===== */
const leaves = [
  { y:210, w:220, h:60 },
  { y:270, w:280, h:70 },
  { y:340, w:340, h:80 }
];

/* ===== 彩帶 ===== */
const ribbons = [
  { leaf:0, offset:0 },
  { leaf:1, offset:0 },
  { leaf:2, offset:0 }
];

/* ===== 裝飾 ===== */
const balls = [];
const gifts = [];

/* ===== 雪花 ===== */
const snow = Array.from({length:120}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: Math.random() * 2 + 1,
  s: Math.random() * 0.4 + 0.2
}));

/* ===== 星星動畫 ===== */
let starPulse = 1;
let starDir = 0.008;

/* ===== 拖曳 ===== */
let dragging = null;

canvas.onmousedown = e => {
  const x = e.offsetX;
  const y = e.offsetY;
  dragging = null;

  gifts.forEach(g=>{
    if(x > CX()+g.x-g.w/2 && x < CX()+g.x+g.w/2 &&
       y > g.y && y < g.y+g.h){
      dragging = g;
    }
  });

  balls.forEach(b=>{
    if(Math.hypot(x-(CX()+b.x), y-b.y) < 10){
      dragging = b;
    }
  });

  if(!dragging){
    balls.push({ x:x-CX(), y });
  }
};

canvas.onmousemove = e => {
  if(!dragging) return;
  dragging.x = e.offsetX - CX();
  dragging.y = e.offsetY;
};

canvas.onmouseup = () => dragging = null;

/* ===== 新增禮物 ===== */
addGift.onclick = () => {
  gifts.push({ x:0, y:420, w:40, h:30 });
};

/* ===== Update / Render ===== */
function update(){
  snow.forEach(s=>{
    s.y += s.s;
    if(s.y > canvas.height) s.y = -5;
  });
  starPulse += starDir;
  if(starPulse > 1.25 || starPulse < 0.85) starDir *= -1;
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawStar();
  drawTrunk();   // ⭐ 新增：樹幹（在樹葉下面）
  drawLeaves();
  drawRibbons();
  drawBalls();
  drawGifts();
  drawSnow();
}

/* ===== Draw ===== */
function drawStar(){
  ctx.save();
  ctx.translate(CX(), 150);
  ctx.scale(starPulse, starPulse);
  ctx.fillStyle = COLORS.star;
  ctx.shadowColor = COLORS.star;
  ctx.shadowBlur = 20;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*18,
               -Math.sin((18+i*72)*Math.PI/180)*18);
    ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8,
               -Math.sin((54+i*72)*Math.PI/180)*8);
  }
  ctx.fill();
  ctx.restore();
}

/* 🌳 樹幹（新增） */
function drawTrunk(){
  ctx.fillStyle = "#8b5a2b";
  ctx.fillRect(CX()-18, 360, 36, 95);
}

function drawLeaves(){
  ctx.fillStyle = COLORS.leaf;
  leaves.forEach(l=>{
    ctx.beginPath();
    ctx.moveTo(CX()-l.w/2, l.y);
    ctx.quadraticCurveTo(CX(), l.y-l.h, CX()+l.w/2, l.y);
    ctx.quadraticCurveTo(CX(), l.y+l.h*0.7, CX()-l.w/2, l.y);
    ctx.fill();
  });
}

function drawRibbons(){
  ctx.strokeStyle = COLORS.ribbon;
  ctx.lineWidth = 5;
  ribbons.forEach(r=>{
    const leaf = leaves[r.leaf];
    const y = leaf.y + r.offset;
    ctx.beginPath();
    ctx.moveTo(CX()-leaf.w/2+20, y);
    ctx.quadraticCurveTo(CX(), y-15, CX()+leaf.w/2-20, y);
    ctx.stroke();
  });
}

function drawBalls(){
  ctx.fillStyle = COLORS.ball;
  balls.forEach(b=>{
    ctx.beginPath();
    ctx.arc(CX()+b.x, b.y, 8, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawGifts(){
  gifts.forEach(g=>{
    ctx.fillStyle = COLORS.gift;
    ctx.fillRect(CX()+g.x-g.w/2, g.y, g.w, g.h);

    ctx.fillStyle = COLORS.ribbon;
    ctx.beginPath();
    ctx.ellipse(CX()+g.x-6, g.y-4, 6, 4, 0, 0, Math.PI*2);
    ctx.ellipse(CX()+g.x+6, g.y-4, 6, 4, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(CX()+g.x, g.y-4, 3, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawSnow(){
  ctx.fillStyle = "white";
  snow.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
}

/* ===== Loop ===== */
(function loop(){
  update();
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
